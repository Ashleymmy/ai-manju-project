<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI-Manju 漫剧资产助手 · MG 操作演示</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
        background: #050714;
        color: #f8f2ff;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 28px;
        background:
          radial-gradient(circle at 78% 12%, rgba(184, 77, 255, 0.22), transparent 32%),
          radial-gradient(circle at 12% 88%, rgba(79, 140, 255, 0.14), transparent 28%),
          #050714;
      }

      main { width: min(1440px, 100%); margin: 0 auto; }

      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 18px;
      }

      h1 { margin: 0; font-size: clamp(24px, 3vw, 38px); letter-spacing: -0.03em; }
      p { margin: 8px 0 0; color: #afa6c3; }

      .badge {
        flex: none;
        padding: 9px 14px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        color: #dcbcff;
        background: rgba(184, 77, 255, 0.11);
        font-size: 13px;
      }

      .stage {
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.11);
        border-radius: 24px;
        background: #090a17;
        box-shadow: 0 26px 80px rgba(0, 0, 0, 0.48);
      }

      object {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #050714;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        padding: 14px;
        border-top: 1px solid rgba(255, 255, 255, 0.09);
        background: rgba(12, 11, 24, 0.94);
      }

      button, a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 38px;
        padding: 0 16px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 11px;
        color: #f8f2ff;
        background: rgba(255, 255, 255, 0.055);
        font: inherit;
        font-size: 13px;
        text-decoration: none;
        cursor: pointer;
      }

      button:hover, a:hover { border-color: rgba(184, 77, 255, 0.55); }
      .primary { border: 0; background: linear-gradient(135deg, #b84dff, #ff4f8c 58%, #4f8cff); font-weight: 700; }
      .time { margin-left: auto; color: #afa6c3; font-variant-numeric: tabular-nums; font-size: 13px; }

      .hint {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-top: 16px;
      }

      .hint div {
        padding: 14px 16px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        color: #afa6c3;
        background: rgba(18, 16, 33, 0.7);
        font-size: 13px;
      }

      .hint strong { display: block; margin-bottom: 4px; color: #f8f2ff; }

      @media (max-width: 760px) {
        body { padding: 14px; }
        header { align-items: flex-start; flex-direction: column; }
        .hint { grid-template-columns: 1fr; }
        .time { width: 100%; margin: 2px 0 0; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>漫剧资产助手 · MG 操作演示</h1>
          <p>从剧本分析到资产自动归档的完整生产流程。</p>
        </div>
        <span class="badge">SVG · 1920×1080 · 48 秒循环</span>
      </header>

      <section class="stage" id="stage">
        <object id="animation" data="./ai-manju-asset-assistant-guide.svg" type="image/svg+xml" aria-label="AI-Manju 漫剧资产助手操作演示"></object>
        <nav class="controls" aria-label="动画控制">
          <button class="primary" id="toggle" type="button">暂停</button>
          <button id="restart" type="button">重新播放</button>
          <button id="fullscreen" type="button">全屏</button>
          <a href="./ai-manju-asset-assistant-guide.svg" target="_blank" rel="noreferrer">单独打开 SVG</a>
          <span class="time" id="time">00:00 / 00:48</span>
        </nav>
      </section>

      <section class="hint" aria-label="使用提示">
        <div><strong>快捷键</strong>空格暂停/继续，R 重新播放，F 全屏。</div>
        <div><strong>演示内容</strong>上传分析、AI 改稿、提示词审核、批量生图、自动归档。</div>
        <div><strong>二次编辑</strong>SVG 为纯矢量，可直接修改文字、颜色、时长和分镜。</div>
      </section>
    </main>

    <script>
      const duration = 48;
      const object = document.querySelector("#animation");
      const stage = document.querySelector("#stage");
      const toggle = document.querySelector("#toggle");
      const restart = document.querySelector("#restart");
      const fullscreen = document.querySelector("#fullscreen");
      const time = document.querySelector("#time");
      let paused = false;
      let startedAt = performance.now();
      let pausedAt = 0;

      function svgRoot() {
        return object.contentDocument?.documentElement ?? null;
      }

      function setPaused(next) {
        paused = next;
        const root = svgRoot();
        root?.classList.toggle("paused", paused);
        toggle.textContent = paused ? "继续" : "暂停";
        if (paused) {
          pausedAt = performance.now();
        } else {
          startedAt += performance.now() - pausedAt;
        }
      }

      function replay() {
        paused = false;
        startedAt = performance.now();
        toggle.textContent = "暂停";
        object.data = `./ai-manju-asset-assistant-guide.svg?restart=${Date.now()}`;
      }

      function format(seconds) {
        return `00:${String(Math.floor(seconds)).padStart(2, "0")}`;
      }

      function tick(now) {
        const elapsed = paused ? pausedAt - startedAt : now - startedAt;
        time.textContent = `${format((elapsed / 1000) % duration)} / 00:48`;
        requestAnimationFrame(tick);
      }

      toggle.addEventListener("click", () => setPaused(!paused));
      restart.addEventListener("click", replay);
      fullscreen.addEventListener("click", () => stage.requestFullscreen?.());
      document.addEventListener("keydown", (event) => {
        if (event.target instanceof HTMLInputElement || event.target instanceof HTMLTextAreaElement) return;
        if (event.code === "Space") { event.preventDefault(); setPaused(!paused); }
        if (event.key.toLowerCase() === "r") replay();
        if (event.key.toLowerCase() === "f") stage.requestFullscreen?.();
      });
      requestAnimationFrame(tick);
    </script>
  </body>
</html>
