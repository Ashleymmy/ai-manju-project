services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - ai-manju-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 3101
      APP_ENV: ${APP_ENV:-production}
      STORAGE_DRIVER: postgres
      REQUIRE_PERSISTENT_STORAGE: ${REQUIRE_PERSISTENT_STORAGE:-true}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:?set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:?set DB_NAME in .env}
      DB_SSLMODE: disable
      FRONTEND_URLS: ${FRONTEND_URLS:?set FRONTEND_URLS in .env}
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOW_PUBLIC_SIGNUP: ${ALLOW_PUBLIC_SIGNUP:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:?set ADMIN_DISPLAY_NAME in .env}
      ASSET_STORAGE_DIR: /app/data/assets
      MAX_ASSET_UPLOAD_BYTES: ${MAX_ASSET_UPLOAD_BYTES:-104857600}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_HOST_PORT:-3101}:3101"
    volumes:
      - ai-manju-assets:/app/data/assets

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in .env}
        NEXT_PUBLIC_PROJECT_STORAGE: ${NEXT_PUBLIC_PROJECT_STORAGE:-server}
        NEXT_PUBLIC_ALLOW_PUBLIC_SIGNUP: ${NEXT_PUBLIC_ALLOW_PUBLIC_SIGNUP:-false}
    depends_on:
      - api
    environment:
      PORT: 3100
      HOSTNAME: 0.0.0.0
    ports:
      - "${WEB_HOST_PORT:-3100}:3100"

volumes:
  ai-manju-postgres-data:
  ai-manju-assets:
