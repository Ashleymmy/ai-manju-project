services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - ai-manju-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 3101
      APP_ENV: ${APP_ENV:-production}
      STORAGE_DRIVER: postgres
      REQUIRE_PERSISTENT_STORAGE: ${REQUIRE_PERSISTENT_STORAGE:-true}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:?set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:?set DB_NAME in .env}
      DB_SSLMODE: disable
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-20}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-10}
      DB_CONN_MAX_LIFETIME_SECONDS: ${DB_CONN_MAX_LIFETIME_SECONDS:-1800}
      FRONTEND_URLS: ${FRONTEND_URLS:?set FRONTEND_URLS in .env}
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOW_PUBLIC_SIGNUP: ${ALLOW_PUBLIC_SIGNUP:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:?set ADMIN_DISPLAY_NAME in .env}
      ASSET_STORAGE_DIR: /app/data/assets
      PUBLIC_ASSET_BASE_URL: ${PUBLIC_ASSET_BASE_URL:-}
      MAX_ASSET_UPLOAD_BYTES: ${MAX_ASSET_UPLOAD_BYTES:-104857600}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_QUEUE_NAME: ${CELERY_QUEUE_NAME:-celery}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      JOB_DEFAULT_TIMEOUT: ${JOB_DEFAULT_TIMEOUT:-900}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_HOST_PORT:-3101}:3101"
    volumes:
      - ai-manju-assets:/app/data/assets
    command: >
      sh -c "mkdir -p /app/data/assets/jobs &&
      chmod 1777 /app/data/assets /app/data/assets/jobs &&
      chmod -R a+rwX /app/data/assets/jobs &&
      exec /app/ai-manju-api"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3101/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:?set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:?set DB_NAME in .env}
      DB_SSLMODE: disable
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_QUEUE_NAME: ${CELERY_QUEUE_NAME:-celery}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      JOB_DEFAULT_TIMEOUT: ${JOB_DEFAULT_TIMEOUT:-900}
      ASSET_STORAGE_DIR: /app/data/assets
      WORKER_HEALTH_HOST: 0.0.0.0
      WORKER_HEALTH_PORT: 8101
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-8}
      WORKER_PROVIDER_RATE_LIMIT: ${WORKER_PROVIDER_RATE_LIMIT:-}
    expose:
      - "8101"
    volumes:
      - ai-manju-assets:/app/data/assets
    user: root
    command: >
      sh -c "mkdir -p /app/data/assets/jobs &&
      chmod 1777 /app/data/assets /app/data/assets/jobs &&
      chmod -R a+rwX /app/data/assets/jobs &&
      su aiworker -s /bin/sh -c 'uvicorn worker.app:app --host $${WORKER_HEALTH_HOST:-0.0.0.0} --port $${WORKER_HEALTH_PORT:-8101} &
      exec celery -A worker.tasks worker --loglevel=info --concurrency=$${WORKER_CONCURRENCY:-8}'"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${WORKER_HEALTH_PORT:-8101}/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  asset-export-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      STORAGE_DRIVER: postgres
      REQUIRE_PERSISTENT_STORAGE: ${REQUIRE_PERSISTENT_STORAGE:-true}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:?set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:?set DB_NAME in .env}
      DB_SSLMODE: disable
      DB_MAX_OPEN_CONNS: ${ASSET_EXPORT_DB_MAX_OPEN_CONNS:-5}
      DB_MAX_IDLE_CONNS: ${ASSET_EXPORT_DB_MAX_IDLE_CONNS:-2}
      DB_CONN_MAX_LIFETIME_SECONDS: ${DB_CONN_MAX_LIFETIME_SECONDS:-1800}
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      ASSET_STORAGE_DIR: /app/data/assets
    volumes:
      - ai-manju-assets:/app/data/assets
    command: ["/app/ai-manju-asset-export-worker"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "grep -q ai-manju-asset-export-worker /proc/1/cmdline"]
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in .env}
        NEXT_PUBLIC_PROJECT_STORAGE: ${NEXT_PUBLIC_PROJECT_STORAGE:-server}
        NEXT_PUBLIC_ALLOW_PUBLIC_SIGNUP: ${NEXT_PUBLIC_ALLOW_PUBLIC_SIGNUP:-false}
        NEXT_PUBLIC_DIRECTOR_DESK_URL: ${NEXT_PUBLIC_DIRECTOR_DESK_URL:-/director-desk/index.html}
    depends_on:
      api:
        condition: service_healthy
      asset-export-worker:
        condition: service_healthy
    environment:
      PORT: 3100
      HOSTNAME: 0.0.0.0
    command: ["node", "apps/web/server.js"]
    ports:
      - "${WEB_HOST_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3100').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  ai-manju-postgres-data:
  ai-manju-assets:
