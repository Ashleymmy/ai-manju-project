server {
    listen 80;
    listen [::]:80;
    server_name aicavans.cc www.aicavans.cc;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aicavans.cc www.aicavans.cc;

    access_log /www/sites/aicavans/log/access.log main;
    error_log /www/sites/aicavans/log/error.log;

    ssl_certificate /www/sites/aicavans/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/aicavans/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 512m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3101/api/;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3101/health;
    }

    location = /webdav-proxy {
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 125s;
        proxy_pass http://127.0.0.1:3101/webdav-proxy;
    }

    location / {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://127.0.0.1:3100;
    }
}
