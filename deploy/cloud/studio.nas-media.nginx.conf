# 临时 IPv4 → NAS 媒体入口。只读新 Studio / SD-video 测试桶；签名由 NAS 校验。
# 不挂载服务凭据。上线前核对服务器原配置，不能覆盖额外的自定义路由。
map $request_uri $nas_media_allowed {
    default 0;
    # Workspace IDs use the stable ``default:<user_id>`` form.  HTTP clients
    # may encode that colon as ``%3A``; allow only that percent escape while
    # keeping the object-key grammar narrow (no arbitrary encoded separators).
    "~^/storage/v1/object/sign/(?:studio-test-assets|studio-sdvideo-test-(?:inputs|results|thumbnails|volcano))/(?:(?:[A-Za-z0-9_:-]|%3[Aa])(?:[A-Za-z0-9_.:-]|%3[Aa])*/)*(?:[A-Za-z0-9_:-]|%3[Aa])(?:[A-Za-z0-9_.:-]|%3[Aa])*\?token=[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$" 1;
}
map $request_uri $nas_media_reserved {
    default 0;
    ~*^/+storage 1;
}
map "$nas_media_reserved:$nas_media_allowed" $nas_media_reject {
    default 0;
    "1:0" 1;
}
map $request_method $nas_media_read_method {
    default 0;
    GET 1;
    HEAD 1;
    OPTIONS 1;
}
map $http_origin $nas_media_origin {
    default "";
    "https://studio.clouddo.cc" $http_origin;
    "http://47.103.211.217" $http_origin;
}
map $upstream_http_content_type $nas_media_disposition {
    default "attachment";
    "~*^(image/(png|jpeg|gif|webp|avif|bmp|x-icon)|video/(mp4|webm|quicktime)|audio/(mpeg|mp4|ogg|wav|x-wav|webm))(;|$)" $upstream_http_content_disposition;
}
map $nas_media_reserved $nas_media_log_path {
    default $uri;
    1 "[nas-media]";
}
# 不记录 query、请求头或 Referer；上游故障以状态和耗时保留观测证据。
log_format nas_safe_access escape=json '{"time":"$time_iso8601","method":"$request_method","path":"$nas_media_log_path","status":$status,"upstream_status":"$upstream_status","duration":$request_time}';

server {
    listen 3100;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 512m;
    access_log /dev/stdout nas_safe_access;
    # Nginx 原始错误日志会包含签名 query，不能将其写入容器日志。
    # 本 server 的请求故障通过上面的脱敏日志诊断；nginx -t 仍输出配置错误。
    error_log /dev/null;

    # 在规范化路径进入任何 location 前拒绝 /storage/../ 等绕行请求。
    if ($nas_media_reject) { return 404; }

    location ^~ /storage/ {
        if ($nas_media_allowed = 0) { return 404; }
        if ($nas_media_read_method = 0) { return 405; }
        if ($request_method = OPTIONS) { return 204; }

        # 动态解析避免 NAS DNS 故障阻止 Studio 启动；仅使用固定上游。
        resolver 127.0.0.11 valid=30s ipv6=on;
        resolver_timeout 5s;
        set $nas_media_host sd.ggwp.cn:18000;
        proxy_pass https://$nas_media_host$request_uri;
        proxy_ssl_server_name on;
        proxy_ssl_name sd.ggwp.cn;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        # 同源 307 可能携带 Studio Authorization，必须关闭默认请求头转发。
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host sd.ggwp.cn:18000;
        proxy_set_header Connection "";
        proxy_set_header Content-Length "";
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header If-None-Match $http_if_none_match;
        proxy_set_header If-Modified-Since $http_if_modified_since;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 15s;
        proxy_next_upstream off;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_cache off;
        proxy_ignore_headers X-Accel-Redirect X-Accel-Expires X-Accel-Limit-Rate X-Accel-Buffering;

        proxy_hide_header Set-Cookie;
        proxy_hide_header Location;
        proxy_hide_header Refresh;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Content-Disposition;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_intercept_errors on;
        error_page 301 302 303 307 308 = @nas_media_redirect_rejected;

        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        # SVG/HTML 不得借用 Studio 同源执行脚本；非安全媒体强制下载。
        add_header Content-Security-Policy "sandbox; default-src 'none'; img-src 'self' data:; media-src 'self' blob:" always;
        add_header Content-Disposition $nas_media_disposition always;
        add_header Access-Control-Allow-Origin $nas_media_origin always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, If-Range, If-None-Match, If-Modified-Since, Authorization" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, ETag, Content-Disposition" always;
        add_header Vary Origin always;
    }

    location @nas_media_redirect_rejected {
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
        return 502;
    }

    location = /health {
        proxy_pass http://api:3101/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        proxy_pass http://api:3101/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location = /webdav-proxy {
        proxy_pass http://api:3101/webdav-proxy;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 125s;
    }

    # /assets is both a Studio route and Vite's static asset directory.
    location = /assets {
        try_files /index.html =404;
    }

    location ^~ /director-desk/ {
        try_files $uri $uri/ /director-desk/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
