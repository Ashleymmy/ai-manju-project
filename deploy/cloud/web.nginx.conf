log_format safe_access escape=json '{"time":"$time_iso8601","method":"$request_method","path":"$uri","status":$status,"duration":$request_time}';
server {
    listen 3100;
    access_log /dev/stdout safe_access;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 512m;
    add_header Cache-Control "private, no-store" always;
    location ^~ /api/ {
        proxy_pass http://api:3101;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
    }
    location = /webdav-proxy {
        proxy_pass http://api:3101;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 125s;
    }
    location = /health { proxy_pass http://api:3101; }
    location = /assets { try_files /index.html =404; }
    location ^~ /assets/ {
        try_files $uri @retained_assets;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ^~ /director-desk/assets/ {
        try_files $uri @retained_assets;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location @retained_assets {
        root /var/cache/studio-assets;
        try_files $uri =404;
        error_page 404 = @missing_asset;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location @missing_asset {
        add_header Cache-Control "no-store" always;
        return 404;
    }
    location ^~ /director-desk/ { try_files $uri $uri/ /director-desk/index.html; }
    location / { try_files $uri $uri/ /index.html; }
}
