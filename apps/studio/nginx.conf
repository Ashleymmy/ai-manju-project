server {
    listen 3100;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 512m;
    # Entry HTML must never pin a tab to a retired bundle graph.
    add_header Cache-Control "no-store" always;

    location = /health {
        proxy_pass http://api:3101/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        proxy_pass http://api:3101/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location = /webdav-proxy {
        proxy_pass http://api:3101/webdav-proxy;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 125s;
    }

    # /assets is both a Studio route and Vite's static asset directory.
    location = /assets {
        try_files /index.html =404;
    }

    location ^~ /assets/ {
        try_files $uri @retained_assets;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /director-desk/assets/ {
        try_files $uri @retained_assets;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location @retained_assets {
        root /var/cache/studio-assets;
        try_files $uri =404;
        error_page 404 = @missing_asset;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location @missing_asset {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    location ^~ /director-desk/ {
        try_files $uri $uri/ /director-desk/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
