[project]
name = "sd-video"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alibabacloud-oss-v2>=1.2.5",
    "fastapi>=0.135.3",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.10.1",
    "pillow>=12.2.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.24",
    "psycopg[binary]>=3.2.3",
    "redis>=5.2.0",
    "boto3>=1.35.0",
    "uvicorn>=0.44.0",
    "oss2>=2.19.0",
    "alibabacloud-yike20260707>=2.3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "api"]
